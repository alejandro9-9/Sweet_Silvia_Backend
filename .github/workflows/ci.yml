name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Sweet_Silvia/Sweet_Silvia.sln
      - name: Test
        run: dotnet test Sweet_Silvia/Sweet_Silvia.sln --no-restore --configuration Release --logger "console;verbosity=minimal"

services:
  sweet-silvia-api:
    build:
      context: .
      dockerfile: Sweet_Silvia_Api/Dockerfile
    container_name: sweet-silvia-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__SweetSilviaDatabase: Host=sweet-silvia-db;Port=5432;Database=sweet_silvia;Username=postgres;Password=postgres
      Jwt__Issuer: SweetSilvia
      Jwt__Audience: SweetSilvia
      Jwt__SecretKey: CHANGE_ME_SUPER_SECRET_KEY_WITH_32_BYTES
      Jwt__ExpirationMinutes: 30
      RefreshToken__ExpirationDays: 30
      Email__Provider: Log
      Roles__CustomerRoleId: 11111111-1111-1111-1111-111111111111
      Cors__AllowedOrigins__0: http://localhost:3000
      Cors__AllowedOrigins__1: http://localhost:5173
    depends_on:
      sweet-silvia-db:
        condition: service_healthy

  sweet-silvia-db:
    image: postgres:16
    container_name: sweet-silvia-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: sweet_silvia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - sweet_silvia_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sweet_silvia"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sweet_silvia_postgres_data:
